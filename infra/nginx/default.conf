server {
    listen 80;

 
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/patient {
        proxy_pass http://patient-service:4002/api/patient;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
    
    location /api/appointments {
    proxy_pass http://appointment-service:4003/api/appointments;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    }

    location /api/clinical {
        proxy_pass http://clinical-service:4004/api/clinical;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/worker {
        proxy_pass http://worker-service:4005/api/worker;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/reports-analytics {
        proxy_pass http://report-analytics-service:4006/api/reports-analytics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
    
    location /api/ {
        proxy_pass http://auth-service:4001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Cookie $http_cookie;
   
    }

 
    location /swagger/ {
    proxy_pass http://auth-service:4001/swagger/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }

    location /api-docs {
        proxy_pass http://auth-service:4001/api-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}